name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start mock server
        run: |
          node server.js &
          sleep 2

      - name: Run gateway tests
        run: node tests/test-gateway.js

      - name: Run management API tests
        run: node tests/test-management.js
